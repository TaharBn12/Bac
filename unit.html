<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الدروس</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <a class="btn btn-sm" href="admin.html">⚙️ لوحة التحكم</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn">🚪 خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div id="crumbs"></div>
    <div id="head"></div>
    <div class="list" id="lessonsList"></div>
  </main>

  <footer class="footer">آية باك 2027 🇩🇿</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      var data = loadData();

      var unit = getUnit(data, param('unit'));
      if (!unit) { location.replace('home.html'); return; }
      var subject = getSubject(data, unit.subjectId) || { name: 'مادة', color: '' };

    /* مسار التنقل */
    $('#crumbs').innerHTML = breadcrumb([
      { label: '🏠 الرئيسية', href: 'home.html' },
      { label: subject.name, href: 'subject.html?subject=' + encodeURIComponent(subject.id) },
      { label: unit.title }
    ]);

    /* الترويسة */
    $('#head').innerHTML =
      '<div class="page-head ' + (subject.color ? 'c-' + subject.color : '') + '">' +
        '<div class="icon">📑</div>' +
        '<div><h1>' + escapeHtml(unit.title) + '</h1>' +
        '<div class="meta">' + escapeHtml(subject.name) + ' — اختر الدرس لمشاهدة الفيديو والملفات والتمارين</div></div>' +
      '</div>';

    /* قائمة الدروس مع عدد محتويات كل درس */
    var lessons = lessonsOf(data, unit.id);
    var listEl = $('#lessonsList');

    if (!lessons.length) {
      listEl.outerHTML = '<div class="empty">لا توجد دروس في هذه الوحدة بعد.<br>' +
        'أضفها من <a href="admin.html">⚙️ لوحة التحكم</a></div>';
    } else {
      listEl.innerHTML = lessons.map(function (l, i) {
        var vids = resourcesOf(data, l.id, 'video').length;
        var files = resourcesOf(data, l.id, 'pdf').length + resourcesOf(data, l.id, 'image').length;
        var exs = resourcesOf(data, l.id, 'exercise').length;
        return '<a class="row-card ' + (subject.color ? 'c-' + subject.color : '') + '" href="lesson.html?lesson=' + encodeURIComponent(l.id) + '">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<div class="info"><div class="t">' + escapeHtml(l.title) + '</div>' +
          '<div class="badges">' +
            '<span class="badge' + (vids ? ' on' : '') + '">🎬 ' + vids + ' فيديو</span>' +
            '<span class="badge' + (files ? ' on' : '') + '">📎 ' + files + ' ملف</span>' +
            '<span class="badge' + (exs ? ' on' : '') + '">✏️ ' + exs + ' تمرين</span>' +
          '</div></div>' +
          '<div class="arrow">‹</div>' +
        '</a>';
      }).join('');
    }

      $('#logoutBtn').addEventListener('click', doLogout);
    })();
  </script>
</body>
</html>
