<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الدروس</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div id="crumbs"></div>
    <div id="head"></div>
    <div class="list" id="lessonsList"></div>
  </main>

  <footer class="footer">آية باك 2027 <i data-icon="dz"></i></footer>
  <!-- مدخل خفي للوحة التحكم (قفل صغير) -->
  <a class="admin-entry" href="admin.html" aria-label="الإدارة"><i data-icon="lock"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      hydrateIcons();
      initData().then(function () {
      var data = loadData();

      var unit = getUnit(data, param('unit'));
      if (!unit) { location.replace('home.html'); return; }
      var subject = getSubject(data, unit.subjectId) || { name: 'مادة', color: '' };

    /* مسار التنقل */
    $('#crumbs').innerHTML = breadcrumb([
      { label: 'الرئيسية', href: 'home.html', icon: 'home' },
      { label: subject.name, href: 'subject.html?subject=' + encodeURIComponent(subject.id) },
      { label: unit.title }
    ]);

    /* الترويسة */
    $('#head').innerHTML =
      '<div class="page-head ' + (subject.color ? 'c-' + subject.color : '') + '">' +
        '<div class="icon">' + iconHTML(subject.icon, 'layers') + '</div>' +
        '<div><h1>' + escapeHtml(unit.title) + '</h1>' +
        '<div class="meta">' + escapeHtml(subject.name) + ' — اختر الدرس لمشاهدة الفيديو والملفات والتمارين</div></div>' +
      '</div>';

    /* قائمة الدروس مع عدد محتويات كل درس */
    var lessons = lessonsOf(data, unit.id);
    var listEl = $('#lessonsList');

    if (!lessons.length) {
      listEl.outerHTML = '<div class="empty">لا توجد دروس في هذه الوحدة بعد</div>';
    } else {
      listEl.innerHTML = lessons.map(function (l, i) {
        var vids = resourcesOf(data, l.id, 'video').length;
        var files = resourcesOf(data, l.id, 'pdf').length + resourcesOf(data, l.id, 'image').length;
        var exs = resourcesOf(data, l.id, 'exercise').length;
        return '<a class="row-card ' + (subject.color ? 'c-' + subject.color : '') + '" href="lesson.html?lesson=' + encodeURIComponent(l.id) + '">' +
          '<div class="num">' + (i + 1) + '</div>' +
          '<div class="info"><div class="t">' + escapeHtml(l.title) + '</div>' +
          '<div class="badges">' +
            '<span class="badge' + (vids ? ' on' : '') + '">' + svgIcon('film') + ' ' + vids + ' فيديو</span>' +
            '<span class="badge' + (files ? ' on' : '') + '">' + svgIcon('file') + ' ' + files + ' ملف</span>' +
            '<span class="badge' + (exs ? ' on' : '') + '">' + svgIcon('pencil') + ' ' + exs + ' تمرين</span>' +
          '</div></div>' +
          '<div class="arrow">‹</div>' +
        '</a>';
      }).join('');
    }

      $('#logoutBtn').addEventListener('click', doLogout);
      });
    })();
  </script>
</body>
</html>
