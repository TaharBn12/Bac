<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الوحدة التعليمية</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <a class="btn btn-sm btn-schedule-nav" href="schedule.html"><i data-icon="calendar"></i> استعمال الزمن</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div id="crumbs"></div>
    <div id="head"></div>
    <div id="unitBody"></div>
  </main>

  <footer class="footer">آية باك 2027 <i data-icon="dz"></i></footer>
  <!-- مدخل خفي للوحة التحكم (قفل صغير) -->
  <a class="admin-entry" href="admin.html" aria-label="الإدارة"><i data-icon="lock"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      hydrateIcons();
      initData().then(function () {
        var data = loadData();

        var unit = getUnit(data, param('unit'));
        if (!unit) { location.replace('home.html'); return; }
        var subject = getSubject(data, unit.subjectId) || { id: '', name: 'مادة', color: '', icon: 'book' };

        var section = param('section'); /* null | 'lessons' | 'exercises' */
        if (section !== 'lessons' && section !== 'exercises') section = '';

        var lessons = lessonsOf(data, unit.id);
        var exercises = unitExercisesOf(data, unit.id);
        var unitUrl = 'unit.html?unit=' + encodeURIComponent(unit.id);
        var lessonsUrl = unitUrl + '&section=lessons';
        var exercisesUrl = unitUrl + '&section=exercises';
        var colorClass = subject.color ? 'c-' + subject.color : '';

        /* مسار التنقل */
        var crumbs = [
          { label: 'الرئيسية', href: 'home.html', icon: 'home' },
          { label: subject.name, href: 'subject.html?subject=' + encodeURIComponent(subject.id) }
        ];
        if (!section) {
          crumbs.push({ label: unit.title });
          document.title = 'آية باك 2027 — ' + unit.title;
        } else {
          crumbs.push({ label: unit.title, href: unitUrl });
          crumbs.push({ label: section === 'exercises' ? 'التمارين' : 'الدروس' });
          document.title = 'آية باك 2027 — ' + (section === 'exercises' ? 'تمارين ' : 'دروس ') + unit.title;
        }
        $('#crumbs').innerHTML = breadcrumb(crumbs);

        function renderHeader() {
          var doneCount = lessons.concat(exercises).filter(function (it) { return isItemCompleted(it.id); }).length;
          var totalCount = lessons.length + exercises.length;
          var subtitle = !section
            ? escapeHtml(subject.name) + ' — اختر القسم: الدروس أو التمارين'
            : (section === 'exercises'
                ? escapeHtml(subject.name) + ' — اختر التمرين لعرض الفيديو والصور وملفات PDF'
                : escapeHtml(subject.name) + ' — اختر الدرس لمشاهدة الفيديو والملفات والتمارين');
          if (totalCount) {
            subtitle += ' · <b class="txt-done">مكتمل ' + doneCount + ' من ' + totalCount + '</b>';
          }

          $('#head').innerHTML =
            '<div class="page-head ' + colorClass + '">' +
              '<div class="icon">' + iconHTML(subject.icon, 'layers') + '</div>' +
              '<div><h1>' + escapeHtml(unit.title) + '</h1>' +
              '<div class="meta">' + subtitle + '</div></div>' +
            '</div>';
        }

        var bodyEl = $('#unitBody');

        function renderUnitBody() {
          renderHeader();
          /* 1) شاشة الاختيارين عند الدخول للوحدة: دروس | تمارين */
          if (!section) {
            bodyEl.innerHTML =
              '<div class="unit-choices">' +
                '<a class="unit-choice-card choice-lessons ' + colorClass + '" href="' + lessonsUrl + '">' +
                  '<div class="uc-ico">' + svgIcon('film') + '</div>' +
                  '<div class="uc-body">' +
                    '<div class="uc-title">الدروس</div>' +
                    '<p class="uc-desc">شرح الدروس بالفيديو، ملخصات PDF، صور توضيحية وتطبيقات</p>' +
                    '<div class="uc-foot">' +
                      '<span class="badge' + (lessons.length ? ' on' : '') + '">' + svgIcon('film') + ' ' + lessons.length + ' دروس</span>' +
                      '<span class="uc-enter">تصفّح الدروس ‹</span>' +
                    '</div>' +
                  '</div>' +
                '</a>' +
                '<a class="unit-choice-card choice-exercises ' + colorClass + '" href="' + exercisesUrl + '">' +
                  '<div class="uc-ico">' + svgIcon('pencil') + '</div>' +
                  '<div class="uc-body">' +
                    '<div class="uc-title">التمارين</div>' +
                    '<p class="uc-desc">تمارين وسلاسل الوحدة المحلولة بالفيديو والصور وملفات PDF</p>' +
                    '<div class="uc-foot">' +
                      '<span class="badge' + (exercises.length ? ' on' : '') + '">' + svgIcon('pencil') + ' ' + exercises.length + ' تمارين</span>' +
                      '<span class="uc-enter">تصفّح التمارين ‹</span>' +
                    '</div>' +
                  '</div>' +
                '</a>' +
              '</div>';
            return;
          }

          /* شريط تبديل سريع بين الدروس والتمارين داخل الوحدة */
          var switcherHTML =
            '<div class="unit-switch">' +
              '<a class="unit-switch-btn' + (section === 'lessons' ? ' active' : '') + '" href="' + lessonsUrl + '">' +
                svgIcon('film') + ' <span>الدروس</span> <b class="cnt">' + lessons.length + '</b>' +
              '</a>' +
              '<a class="unit-switch-btn' + (section === 'exercises' ? ' active' : '') + '" href="' + exercisesUrl + '">' +
                svgIcon('pencil') + ' <span>التمارين</span> <b class="cnt">' + exercises.length + '</b>' +
              '</a>' +
            '</div>';

          if (section === 'lessons') {
            if (!lessons.length) {
              bodyEl.innerHTML = switcherHTML + '<div class="empty">لا توجد دروس في هذه الوحدة بعد</div>';
            } else {
              bodyEl.innerHTML = switcherHTML + '<div class="list">' + lessons.map(function (l, i) {
                var vids = resourcesOf(data, l.id, 'video').length;
                var files = resourcesOf(data, l.id, 'pdf').length + resourcesOf(data, l.id, 'image').length;
                var exs = resourcesOf(data, l.id, 'exercise').length;
                var done = isItemCompleted(l.id);
                return '<div class="row-card-wrap' + (done ? ' is-completed-card' : '') + '">' +
                  '<a class="row-card ' + colorClass + (done ? ' is-completed-item' : '') + '" href="lesson.html?lesson=' + encodeURIComponent(l.id) + '">' +
                    '<div class="num">' + (done ? svgIcon('check') : (i + 1)) + '</div>' +
                    '<div class="info"><div class="t">' + escapeHtml(l.title) + '</div>' +
                    '<div class="badges">' +
                      (done ? '<span class="badge done-badge">' + svgIcon('check-circle') + ' مكتمل</span>' : '') +
                      '<span class="badge' + (vids ? ' on' : '') + '">' + svgIcon('film') + ' ' + vids + ' فيديو</span>' +
                      '<span class="badge' + (files ? ' on' : '') + '">' + svgIcon('file') + ' ' + files + ' ملف</span>' +
                      (exs ? '<span class="badge on">' + svgIcon('pencil') + ' ' + exs + ' تمرين</span>' : '') +
                    '</div></div>' +
                    '<div class="arrow">‹</div>' +
                  '</a>' +
                  '<button type="button" class="card-complete-btn' + (done ? ' done' : '') + '" data-complete-id="' + l.id + '" title="' + (done ? 'مكتمل — اضغط للإلغاء' : 'إكمال الدرس (يظهر بالأخضر في استعمال الزمن)') + '">' +
                    svgIcon(done ? 'check-circle' : 'check') + '<span>' + (done ? 'مكتمل ✓' : 'إكمال الدرس') + '</span>' +
                  '</button>' +
                '</div>';
              }).join('') + '</div>';
            }
          } else {
            /* قائمة تمارين الوحدة المرقّمة */
            if (!exercises.length) {
              bodyEl.innerHTML = switcherHTML + '<div class="empty">لا توجد تمارين مضافة في هذه الوحدة بعد</div>';
            } else {
              bodyEl.innerHTML = switcherHTML + '<div class="list">' + exercises.map(function (ex, i) {
                var vids = resourcesOf(data, ex.id, 'video').length;
                var pdfs = resourcesOf(data, ex.id, 'pdf').length;
                var imgs = resourcesOf(data, ex.id, 'image').length;
                var done = isItemCompleted(ex.id);
                return '<div class="row-card-wrap' + (done ? ' is-completed-card' : '') + '">' +
                  '<a class="row-card exercise-row-card ' + colorClass + (done ? ' is-completed-item' : '') + '" href="lesson.html?lesson=' + encodeURIComponent(ex.id) + '">' +
                    '<div class="num">' + (done ? svgIcon('check') : (i + 1)) + '</div>' +
                    '<div class="info"><div class="t">' + escapeHtml(ex.title) + '</div>' +
                    '<div class="badges">' +
                      (done ? '<span class="badge done-badge">' + svgIcon('check-circle') + ' مكتمل</span>' : '') +
                      '<span class="badge' + (vids ? ' on' : '') + '">' + svgIcon('film') + ' ' + vids + ' فيديو</span>' +
                      '<span class="badge' + (pdfs ? ' on' : '') + '">' + svgIcon('file') + ' ' + pdfs + ' PDF</span>' +
                      '<span class="badge' + (imgs ? ' on' : '') + '">' + svgIcon('image') + ' ' + imgs + ' صورة</span>' +
                    '</div></div>' +
                    '<div class="arrow">‹</div>' +
                  '</a>' +
                  '<button type="button" class="card-complete-btn' + (done ? ' done' : '') + '" data-complete-id="' + ex.id + '" title="' + (done ? 'مكتمل — اضغط للإلغاء' : 'إكمال التمرين (يظهر بالأخضر في استعمال الزمن)') + '">' +
                    svgIcon(done ? 'check-circle' : 'check') + '<span>' + (done ? 'مكتمل ✓' : 'إكمال التمرين') + '</span>' +
                  '</button>' +
                '</div>';
              }).join('') + '</div>';
            }
          }
        }

        bodyEl.addEventListener('click', function (e) {
          var cBtn = e.target.closest('[data-complete-id]');
          if (!cBtn) return;
          e.preventDefault();
          e.stopPropagation();
          var nowDone = toggleItemCompleted(cBtn.dataset.completeId);
          renderUnitBody();
          toast(nowDone ? 'أحسنت! ظهر العنصر باللون الأخضر في استعمال الزمن ولن يتكرر الأسبوع القادم' : 'تم إلغاء علامة الإكمال', nowDone ? 'ok' : 'info');
        });

        renderUnitBody();
        $('#logoutBtn').addEventListener('click', doLogout);
      });
    })();
  </script>
</body>
</html>
