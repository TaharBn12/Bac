<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الصفحة الرئيسية</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <a class="btn btn-sm btn-schedule-nav" href="schedule.html"><i data-icon="calendar"></i> استعمال الزمن</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <section class="hero">
      <h1>أهلاً بك في <span>آية باك 2027</span> <i data-icon="sparkles"></i></h1>
      <p>كل مواد البكالوريا: وحدات، دروس بالفيديو، ملخصات PDF، صور توضيحية وتمارين</p>
      <div class="search-wrap">
        <span class="ico"><i data-icon="search"></i></span>
        <input type="search" id="searchInput" placeholder="ابحث عن مادة..." autocomplete="off">
      </div>
    </section>

    <div id="schedulePromoMount"></div>

    <h2 class="section-title"><i data-icon="book"></i> المواد الدراسية</h2>
    <div class="grid" id="subjectsGrid"></div>
  </main>

  <footer class="footer">
    آية باك 2027 — منصة تعليمية لطلاب البكالوريا في الجزائر <i data-icon="dz"></i>
  </footer>
  <!-- مدخل خفي للوحة التحكم (قفل صغير) -->
  <a class="admin-entry" href="admin.html" aria-label="الإدارة"><i data-icon="lock"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      hydrateIcons();
      initData().then(function () {
      var data = loadData();
      var allVisibleSubjects = visibleSubjectsOf(data);

      /* بطاقة استعمال الزمن الدراسي الأسبوعي */
      var promoMount = $('#schedulePromoMount');
      if (promoMount && typeof getStudyCycleInfo === 'function') {
        var cycle = getStudyCycleInfo();
        var totalItems = 0, completedItems = 0;
        allVisibleSubjects.forEach(function (s) {
          unitsOf(data, s.id).forEach(function (u) {
            lessonsOf(data, u.id).concat(unitExercisesOf(data, u.id)).forEach(function (it) {
              totalItems++;
              if (isItemCompleted(it.id)) completedItems++;
            });
          });
        });
        promoMount.innerHTML =
          '<a class="schedule-home-banner" href="schedule.html">' +
            '<div class="shb-icon">' + svgIcon('calendar') + '</div>' +
            '<div class="shb-body">' +
              '<div class="shb-kicker">' + svgIcon('clock') + ' يتجدد تلقائياً كل سبت على 10:00 ليلاً · باقي ' +
                cycle.remaining.days + ' يوم و ' + cycle.remaining.hours + ' ساعة</div>' +
              '<h2>استعمال الزمن الدراسي الأسبوعي الذكي</h2>' +
              '<p>خطة أسبوعية مرتّبة حسب معامل كل مادة وتسلسل الدروس — أنجزتِ حتى الآن <b>' + completedItems + '</b> من أصل <b>' + totalItems + '</b> درس وتمرين</p>' +
            '</div>' +
            '<div class="shb-cta">' +
              '<span class="btn btn-primary">' + svgIcon('calendar') + ' فتح استعمال الزمن</span>' +
            '</div>' +
          '</a>';
      }

      function renderSubjects(filter) {
      var grid = $('#subjectsGrid');
      var list = visibleSubjectsOf(data)
        .filter(function (s) {
          return !filter || s.name.indexOf(filter.trim()) !== -1;
        });

      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة لبحثك</div>';
        return;
      }

      grid.innerHTML = list.map(function (s) {
        var units = unitsOf(data, s.id);
        var coeff = getSubjectCoefficient(s);
        var lessonCount = 0, exCount = 0, doneCount = 0;
        units.forEach(function (u) {
          var ls = lessonsOf(data, u.id);
          var exs = unitExercisesOf(data, u.id);
          lessonCount += ls.length;
          exCount += exs.length;
          ls.concat(exs).forEach(function (it) { if (isItemCompleted(it.id)) doneCount++; });
        });
        var totalInSubj = lessonCount + exCount;
        return '<a class="subject-card ' + (s.color ? 'c-' + s.color : '') + '" href="subject.html?subject=' + encodeURIComponent(s.id) + '">' +
          '<span class="subj-coeff-badge">المعامل ' + coeff + '</span>' +
          '<span class="arrow">‹</span>' +
          '<div class="icon">' + iconHTML(s.icon, 'book') + '</div>' +
          '<div class="name">' + escapeHtml(s.name) + '</div>' +
          '<div class="meta">' + units.length + ' وحدات · ' + lessonCount + ' دروس' + (exCount ? ' · ' + exCount + ' تمارين' : '') + '</div>' +
          (doneCount > 0 ? '<div class="subj-done-pill">' + svgIcon('check-circle') + ' مكتمل ' + doneCount + ' / ' + totalInSubj + '</div>' : '') +
        '</a>';
      }).join('');
    }

    $('#searchInput').addEventListener('input', function () { renderSubjects(this.value); });
    $('#logoutBtn').addEventListener('click', doLogout);

    renderSubjects('');
      });
    })();
  </script>
</body>
</html>
