<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الصفحة الرئيسية</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <section class="hero">
      <h1>أهلاً بك في <span>آية باك 2027</span> <i data-icon="sparkles"></i></h1>
      <p>كل مواد البكالوريا: وحدات، دروس بالفيديو، ملخصات PDF، صور توضيحية وتمارين</p>
      <div class="search-wrap">
        <span class="ico"><i data-icon="search"></i></span>
        <input type="search" id="searchInput" placeholder="ابحث عن مادة..." autocomplete="off">
      </div>
    </section>

    <h2 class="section-title"><i data-icon="book"></i> المواد الدراسية</h2>
    <div class="grid" id="subjectsGrid"></div>
  </main>

  <footer class="footer">
    آية باك 2027 — منصة تعليمية لطلاب البكالوريا في الجزائر <i data-icon="dz"></i>
  </footer>
  <!-- مدخل خفي للوحة التحكم (قفل صغير) -->
  <a class="admin-entry" href="admin.html" aria-label="الإدارة"><i data-icon="lock"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      hydrateIcons();
      initData().then(function () {
      var data = loadData();

      function renderSubjects(filter) {
      var grid = $('#subjectsGrid');
      var list = data.subjects.slice().sort(byOrder)
        .filter(function (s) {
          return !filter || s.name.indexOf(filter.trim()) !== -1;
        });

      if (!list.length) {
        grid.innerHTML = '<div class="empty" style="grid-column:1/-1">لا توجد نتائج مطابقة لبحثك</div>';
        return;
      }

      grid.innerHTML = list.map(function (s) {
        var units = unitsOf(data, s.id);
        var lessonCount = units.reduce(function (n, u) { return n + lessonsOf(data, u.id).length; }, 0);
        return '<a class="subject-card ' + (s.color ? 'c-' + s.color : '') + '" href="subject.html?subject=' + encodeURIComponent(s.id) + '">' +
          '<span class="arrow">‹</span>' +
          '<div class="icon">' + iconHTML(s.icon, 'book') + '</div>' +
          '<div class="name">' + escapeHtml(s.name) + '</div>' +
          '<div class="meta">' + units.length + ' وحدات · ' + lessonCount + ' دروس</div>' +
        '</a>';
      }).join('');
    }

    $('#searchInput').addEventListener('input', function () { renderSubjects(this.value); });
    $('#logoutBtn').addEventListener('click', doLogout);

    renderSubjects('');
      });
    })();
  </script>
</body>
</html>
