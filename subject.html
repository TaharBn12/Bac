<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الوحدات</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <a class="btn btn-sm btn-schedule-nav" href="schedule.html"><i data-icon="calendar"></i> استعمال الزمن</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div id="crumbs"></div>
    <div id="head"></div>
    <div class="list" id="unitsList"></div>
  </main>

  <footer class="footer">آية باك 2027 <i data-icon="dz"></i></footer>
  <!-- مدخل خفي للوحة التحكم (قفل صغير) -->
  <a class="admin-entry" href="admin.html" aria-label="الإدارة"><i data-icon="lock"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      hydrateIcons();
      initData().then(function () {
      var data = loadData();

      var subject = getSubject(data, param('subject'));
      if (!subject) { location.replace('home.html'); return; }
      var coeff = getSubjectCoefficient(subject);

      /* مسار التنقل */
      $('#crumbs').innerHTML = breadcrumb([
        { label: 'الرئيسية', href: 'home.html', icon: 'home' },
        { label: subject.name }
      ]);

      /* الترويسة */
      $('#head').innerHTML =
        '<div class="page-head ' + (subject.color ? 'c-' + subject.color : '') + '">' +
          '<div class="icon">' + iconHTML(subject.icon, 'book') + '</div>' +
          '<div>' +
            '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
              '<h1>' + escapeHtml(subject.name) + '</h1>' +
              '<span class="subj-coeff-badge">المعامل ' + coeff + '</span>' +
            '</div>' +
            '<div class="meta">الوحدة الأولى مفتوحة افتراضياً والبقية تفتح بالضغط على زر السهم</div>' +
          '</div>' +
        '</div>';

      /* قائمة الوحدات: الوحدة الأولى مفتوحة والبقية مطوية بزر سهم لإظهار/إخفاء المحتوى */
      var units = unitsOf(data, subject.id);
      var listEl = $('#unitsList');

      if (!units.length) {
        listEl.outerHTML = '<div class="empty">لا توجد وحدات في هذه المادة بعد</div>';
      } else {
        listEl.innerHTML = units.map(function (u, i) {
          var ls = lessonsOf(data, u.id);
          var exs = unitExercisesOf(data, u.id);
          var doneCount = ls.concat(exs).filter(function (it) { return isItemCompleted(it.id); }).length;
          var totalCount = ls.length + exs.length;
          var isFirst = (i === 0);

          var previewHTML = ls.slice(0, 4).map(function (l, li) {
            var done = isItemCompleted(l.id);
            return '<a class="unit-preview-row' + (done ? ' is-done' : '') + '" href="lesson.html?lesson=' + encodeURIComponent(l.id) + '">' +
              '<span class="upr-num">' + (done ? svgIcon('check') : (li + 1)) + '</span>' +
              '<span class="upr-title">' + escapeHtml(l.title) + '</span>' +
              (done ? '<span class="done-mini-tag">مكتمل ✓</span>' : '<span class="upr-go">' + svgIcon('chevron-left') + '</span>') +
            '</a>';
          }).join('');

          return '<article class="unit-acc-student ' + (subject.color ? 'c-' + subject.color : '') + (isFirst ? ' is-open' : ' is-collapsed') + '" data-unit-acc>' +
            '<div class="row-card unit-acc-trigger" role="button" tabindex="0" aria-expanded="' + (isFirst ? 'true' : 'false') + '">' +
              '<div class="num">' + (i + 1) + '</div>' +
              '<div class="info"><div class="t">' + escapeHtml(u.title) + '</div>' +
              '<div class="badges">' +
                '<span class="badge' + (ls.length ? ' on' : '') + '">' + svgIcon('film') + ' ' + ls.length + ' دروس</span>' +
                '<span class="badge' + (exs.length ? ' on' : '') + '">' + svgIcon('pencil') + ' ' + exs.length + ' تمارين</span>' +
                (doneCount ? '<span class="badge done-badge">' + svgIcon('check-circle') + ' مكتمل ' + doneCount + '/' + totalCount + '</span>' : '') +
              '</div></div>' +
              '<button type="button" class="btn-acc-arrow' + (isFirst ? ' open' : '') + '" data-toggle-unit>' +
                '<span>' + (isFirst ? 'إخفاء' : 'إظهار المحتوى') + '</span>' + svgIcon('chevron-down') +
              '</button>' +
            '</div>' +
            '<div class="unit-acc-panel"' + (isFirst ? '' : ' hidden') + '>' +
              (previewHTML ? '<div class="unit-preview-list">' + previewHTML +
                (ls.length > 4 ? '<a class="unit-more-link" href="unit.html?unit=' + encodeURIComponent(u.id) + '&section=lessons">+ عرض بقية الدروس (' + ls.length + ')</a>' : '') +
              '</div>' : '') +
              '<div class="unit-card-actions">' +
                '<a class="btn btn-primary btn-sm" href="unit.html?unit=' + encodeURIComponent(u.id) + '&section=lessons">' +
                  svgIcon('film') + ' صفحة الدروس (' + ls.length + ')' +
                '</a>' +
                '<a class="btn btn-sm" href="unit.html?unit=' + encodeURIComponent(u.id) + '&section=exercises">' +
                  svgIcon('pencil') + ' صفحة التمارين (' + exs.length + ')' +
                '</a>' +
                '<a class="btn btn-sm" href="unit.html?unit=' + encodeURIComponent(u.id) + '">' +
                  svgIcon('layers') + ' فتح الوحدة' +
                '</a>' +
              '</div>' +
            '</div>' +
          '</article>';
        }).join('');

        $all('[data-unit-acc]', listEl).forEach(function (card) {
          var trigger = card.querySelector('.unit-acc-trigger');
          var panel = card.querySelector('.unit-acc-panel');
          var arrBtn = card.querySelector('[data-toggle-unit]');
          function toggleUnit() {
            var nowOpen = panel.hidden;
            panel.hidden = !nowOpen;
            card.classList.toggle('is-open', nowOpen);
            card.classList.toggle('is-collapsed', !nowOpen);
            trigger.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
            if (arrBtn) {
              arrBtn.classList.toggle('open', nowOpen);
              var sp = arrBtn.querySelector('span');
              if (sp) sp.textContent = nowOpen ? 'إخفاء' : 'إظهار المحتوى';
            }
          }
          trigger.addEventListener('click', function (e) {
            if (e.target.closest('a')) return;
            toggleUnit();
          });
          trigger.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleUnit(); }
          });
        });
      }

      $('#logoutBtn').addEventListener('click', doLogout);
      });
    })();
  </script>
</body>
</html>
