<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الوحدات</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <a class="btn btn-sm" href="admin.html">⚙️ لوحة التحكم</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn">🚪 خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div id="crumbs"></div>
    <div id="head"></div>
    <div class="list" id="unitsList"></div>
  </main>

  <footer class="footer">آية باك 2027 🇩🇿</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    'use strict';
    (function () {
      requireAuth();
      var data = loadData();

      var subject = getSubject(data, param('subject'));
      if (!subject) { location.replace('home.html'); return; }

      /* مسار التنقل */
      $('#crumbs').innerHTML = breadcrumb([
        { label: '🏠 الرئيسية', href: 'home.html' },
        { label: subject.name }
      ]);

      /* الترويسة */
      $('#head').innerHTML =
        '<div class="page-head ' + (subject.color ? 'c-' + subject.color : '') + '">' +
          '<div class="icon">' + escapeHtml(subject.icon || '📘') + '</div>' +
          '<div><h1>' + escapeHtml(subject.name) + '</h1>' +
          '<div class="meta">اختر الوحدة التعليمية لعرض دروسها</div></div>' +
        '</div>';

      /* قائمة الوحدات */
      var units = unitsOf(data, subject.id);
      var listEl = $('#unitsList');

      if (!units.length) {
        listEl.outerHTML = '<div class="empty">لا توجد وحدات في هذه المادة بعد.<br>' +
          'أضفها من <a href="admin.html">⚙️ لوحة التحكم</a></div>';
      } else {
        listEl.innerHTML = units.map(function (u, i) {
          var ls = lessonsOf(data, u.id);
          return '<a class="row-card ' + (subject.color ? 'c-' + subject.color : '') + '" href="unit.html?unit=' + encodeURIComponent(u.id) + '">' +
            '<div class="num">' + (i + 1) + '</div>' +
            '<div class="info"><div class="t">' + escapeHtml(u.title) + '</div>' +
            '<div class="badges"><span class="badge on">' + ls.length + ' دروس</span>' +
            (ls.length ? '' : '<span class="badge">فارغة</span>') + '</div></div>' +
            '<div class="arrow">‹</div>' +
          '</a>';
        }).join('');
      }

      $('#logoutBtn').addEventListener('click', doLogout);
    })();
  </script>
</body>
</html>
