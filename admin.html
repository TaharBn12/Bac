<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — لوحة التحكم</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- بوابة كلمة السر الخاصة بلوحة التحكم -->
  <div class="auth-body" id="adminGate" hidden>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <main>
      <div class="auth-card" id="gateCard">
        <div class="logo">
          <span class="logo-icon">⚙️</span>
          <span class="logo-text">لوحة <b>التحكم</b></span>
        </div>
        <p class="tagline">هذه الصفحة مخصصة لإدارة محتوى الموقع<br>أدخل كلمة السر للمتابعة</p>
        <form id="gateForm" novalidate>
          <label class="field">
            <span>🔑 كلمة السر</span>
            <div class="pw-wrap">
              <input type="password" id="gatePw" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="pw-toggle" id="gateToggle">👁️</button>
            </div>
          </label>
          <p class="error-msg" id="gateErr" hidden>❌ كلمة السر غير صحيحة</p>
          <button class="btn btn-primary btn-block" type="submit">🔓 دخول لوحة التحكم</button>
          <a class="btn btn-block" href="home.html" style="margin-top:10px">→ العودة للموقع</a>
        </form>
      </div>
    </main>
  </div>

  <!-- التطبيق -->
  <div id="adminApp" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="logo" href="home.html">
          <span class="logo-icon">⚙️</span>
          <span class="logo-text">لوحة <b>التحكم</b></span>
          <span class="logo-year">آية باك 2027</span>
        </a>
      <div class="top-actions">
        <span class="cloud-badge off" id="cloudStatus">☁️ …</span>
        <a class="btn btn-sm btn-primary" href="home.html">👁️ معاينة الموقع</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn">🚪 خروج</button>
      </div>
      </div>
    </header>

    <main class="container">
      <nav class="tabs" id="tabsNav">
        <button class="tab active" data-tab="subjects">📚 المواد</button>
        <button class="tab" data-tab="units">📑 الوحدات</button>
        <button class="tab" data-tab="lessons">🎬 الدروس</button>
        <button class="tab" data-tab="content">➕ المحتوى (فيديو / ملفات / تمارين)</button>
        <button class="tab" data-tab="backup">💾 نسخ احتياطي</button>
      </nav>

      <section class="panel" id="panel"></section>
    </main>

    <footer class="footer">آية باك 2027 — لوحة التحكم 🇩🇿</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/admin.js"></script>
  <script>
    'use strict';
    initAdmin();
  </script>
</body>
</html>
