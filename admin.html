<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — لوحة التحكم</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-body">

  <!-- بوابة كلمة السر الخاصة بلوحة التحكم -->
  <div class="auth-body" id="adminGate" hidden>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <main>
      <div class="auth-card" id="gateCard">
        <div class="logo">
          <span class="logo-icon"><i data-icon="gear"></i></span>
          <span class="logo-text">لوحة <b>التحكم</b></span>
        </div>
        <p class="tagline">هذه الصفحة مخصصة لإدارة محتوى الموقع<br>أدخل كلمة مرور الإدارة للمتابعة</p>
        <form id="gateForm" novalidate>
          <label class="field">
            <span><i data-icon="key"></i> كلمة مرور الإدارة</span>
            <div class="pw-wrap">
              <input type="password" id="gatePw" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="pw-toggle" id="gateToggle"><i data-icon="eye"></i></button>
            </div>
          </label>
          <p class="error-msg" id="gateErr" hidden><i data-icon="x-circle"></i> كلمة مرور الإدارة غير صحيحة</p>
          <button class="btn btn-primary btn-block" type="submit"><i data-icon="unlock"></i> دخول لوحة التحكم</button>
          <a class="btn btn-block" href="home.html" style="margin-top:10px"><i data-icon="chevron-left"></i> العودة للموقع</a>
        </form>
      </div>
    </main>
  </div>

  <!-- التطبيق -->
  <div id="adminApp" hidden>
    <div class="admin-shell" id="adminShell">

      <!-- الدراور الجانبي -->
      <aside class="admin-drawer" id="adminDrawer" aria-label="قائمة لوحة التحكم">
        <div class="drawer-head">
          <a class="logo" href="home.html">
            <span class="logo-icon"><i data-icon="gear"></i></span>
            <span class="logo-text">لوحة <b>التحكم</b></span>
          </a>
          <button type="button" class="drawer-close" id="drawerClose" aria-label="إغلاق القائمة"><i data-icon="x"></i></button>
        </div>

        <div class="drawer-scroll">
          <p class="nav-label">عام</p>
          <button type="button" class="nav-link" data-tab="overview"><i data-icon="chart"></i> <span>نظرة عامة</span></button>

          <p class="nav-label">المحتوى الدراسي</p>
          <button type="button" class="nav-link" data-tab="subjects"><i data-icon="book"></i> <span>المواد</span></button>
          <button type="button" class="nav-link" data-tab="organizer"><i data-icon="layers"></i> <span>منظّم المحتوى</span></button>
          <button type="button" class="nav-link" data-tab="units"><i data-icon="layers"></i> <span>الوحدات</span></button>
          <button type="button" class="nav-link" data-tab="lessons"><i data-icon="film"></i> <span>الدروس</span></button>
          <button type="button" class="nav-link" data-tab="exercises"><i data-icon="pencil"></i> <span>التمارين</span></button>
          <button type="button" class="nav-link" data-tab="content"><i data-icon="plus"></i> <span>محتوى الدرس والتمارين</span></button>

          <p class="nav-label">صفحات المادة</p>
          <button type="button" class="nav-link" data-tab="sections"><i data-icon="cap"></i> <span>الأقسام والبكالوريات</span></button>

          <p class="nav-label">أدوات</p>
          <button type="button" class="nav-link" data-tab="schedule"><i data-icon="calendar"></i> <span>استعمال الزمن</span></button>
          <button type="button" class="nav-link" data-tab="ai"><i data-icon="sparkles"></i> <span>الذكاء الاصطناعي</span></button>
          <button type="button" class="nav-link" data-tab="backup"><i data-icon="save"></i> <span>نسخ احتياطي</span></button>
        </div>

        <div class="drawer-foot">
          <span class="cloud-badge off" id="cloudStatus"><i data-icon="cloud"></i> …</span>
          <a class="btn btn-sm btn-primary btn-block" href="home.html"><i data-icon="eye"></i> معاينة الموقع</a>
          <button class="btn btn-sm btn-danger btn-block" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
        </div>
      </aside>

      <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>

      <div class="admin-main">
        <header class="topbar admin-topbar">
          <div class="topbar-inner">
            <div class="admin-topbar-start">
              <button type="button" class="icon-btn menu-btn" id="drawerToggle" aria-label="فتح القائمة"><i data-icon="sliders"></i></button>
              <button type="button" class="icon-btn menu-btn desktop-only" id="drawerCollapse" aria-label="تصغير القائمة"><i data-icon="chevron-right"></i></button>
              <span class="admin-page-title" id="adminPageTitle">نظرة عامة</span>
            </div>
            <div class="top-actions">
              <button type="button" class="btn btn-sm" id="topAdminSchedBtn"><i data-icon="calendar"></i> استعمال الزمن</button>
              <a class="btn btn-sm" href="admin.html" title="تحديث"><i data-icon="refresh"></i></a>
            </div>
          </div>
        </header>

        <main class="container admin-container">
          <section class="panel" id="panel"></section>
        </main>

        <footer class="footer">آية باك 2027 — لوحة التحكم <i data-icon="dz"></i></footer>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/ai-admin.js"></script>
  <script>
    'use strict';
    initAdmin();
  </script>
</body>
</html>
