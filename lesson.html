<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الدرس</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <button class="btn btn-sm btn-danger" id="logoutBtn"><i data-icon="logout"></i> خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div class="lesson-wrap">
      <div id="crumbs"></div>
      <h1 class="lesson-title" id="lessonTitle"></h1>

      <!-- مشغل الفيديو -->
      <div class="player-shell" id="playerShell"></div>

      <!-- تبويبات الفيديوهات (إن وُجد أكثر من فيديو) -->
      <div class="video-tabs" id="videoTabs"></div>

      <!-- ملفات PDF -->
      <section class="lesson-section" id="pdfSection">
        <h2><i data-icon="file"></i> ملفات وملخصات PDF</h2>
        <div class="pdf-grid" id="pdfGrid"></div>
      </section>

      <!-- الصور -->
      <section class="lesson-section" id="imgSection">
        <h2><i data-icon="image"></i> صور توضيحية</h2>
        <div class="img-gallery" id="imgGallery"></div>
      </section>

      <!-- التمارين -->
      <section class="lesson-section" id="exSection">
        <h2><i data-icon="pencil"></i> تمارين وتطبيقات</h2>
        <div class="ex-btns" id="exBtns"></div>
      </section>

      <div class="empty" id="emptyAll" hidden>
        هذا الدرس لا يحتوي على محتوى بعد
      </div>
    </div>
  </main>

  <!-- عارض الصور -->
  <div class="lightbox" id="lightbox">
    <button class="lb-btn lb-close" id="lbClose" aria-label="إغلاق"><i data-icon="x"></i></button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="السابق"><i data-icon="chevron-right"></i></button>
    <img id="lbImg" alt="">
    <button class="lb-btn lb-next" id="lbNext" aria-label="التالي"><i data-icon="chevron-left"></i></button>
    <div class="lb-cap" id="lbCap"></div>
  </div>

  <footer class="footer">آية باك 2027 <i data-icon="dz"></i></footer>
  <!-- مدخل خفي للوحة التحكم (قفل صغير) -->
  <a class="admin-entry" href="admin.html" aria-label="الإدارة"><i data-icon="lock"></i></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/lesson.js"></script>
  <script>
    'use strict';
    requireAuth();
    hydrateIcons();
    initData().then(initLessonPage);
  </script>
</body>
</html>
