<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — الدرس</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="home.html">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </a>
      <div class="top-actions">
        <a class="btn btn-sm" href="admin.html">⚙️ لوحة التحكم</a>
        <button class="btn btn-sm btn-danger" id="logoutBtn">🚪 خروج</button>
      </div>
    </div>
  </header>

  <main class="container page">
    <div class="lesson-wrap">
      <div id="crumbs"></div>
      <h1 class="lesson-title" id="lessonTitle"></h1>

      <!-- مشغل الفيديو -->
      <div class="player-shell" id="playerShell"></div>

      <!-- تبويبات الفيديوهات (إن وُجد أكثر من فيديو) -->
      <div class="video-tabs" id="videoTabs"></div>

      <!-- ملفات PDF -->
      <section class="lesson-section" id="pdfSection">
        <h2>📄 ملفات وملخصات PDF</h2>
        <div class="pdf-grid" id="pdfGrid"></div>
      </section>

      <!-- الصور -->
      <section class="lesson-section" id="imgSection">
        <h2>🖼️ صور توضيحية</h2>
        <div class="img-gallery" id="imgGallery"></div>
      </section>

      <!-- التمارين -->
      <section class="lesson-section" id="exSection">
        <h2>✏️ تمارين وتطبيقات</h2>
        <div class="ex-btns" id="exBtns"></div>
      </section>

      <div class="empty" id="emptyAll" hidden>
        هذا الدرس لا يحتوي على محتوى بعد.<br>
        أضف الفيديوهات والملفات والتمارين من <a href="admin.html">⚙️ لوحة التحكم</a>
      </div>

      <div style="margin-top:30px;text-align:center">
        <a class="btn btn-sm" id="editLessonLink" href="admin.html">⚙️ إضافة محتوى لهذا الدرس</a>
      </div>
    </div>
  </main>

  <!-- عارض الصور -->
  <div class="lightbox" id="lightbox">
    <button class="lb-btn lb-close" id="lbClose" aria-label="إغلاق">✕</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="السابق">›</button>
    <img id="lbImg" alt="">
    <button class="lb-btn lb-next" id="lbNext" aria-label="التالي">‹</button>
    <div class="lb-cap" id="lbCap"></div>
  </div>

  <footer class="footer">آية باك 2027 🇩🇿</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/lesson.js"></script>
  <script>
    'use strict';
    initLessonPage();
    var el = $('#editLessonLink');
    if (el && param('lesson')) el.href = 'admin.html?lesson=' + encodeURIComponent(param('lesson'));
  </script>
</body>
</html>
