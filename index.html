<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آية باك 2027 — تسجيل الدخول</title>
  <meta name="description" content="آية باك 2027 — منصة تعليمية لطلاب شهادة البكالوريا في الجزائر">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f5c542'/%3E%3Cpath d='M50 24 12 42l38 18 38-18z' fill='%231a1440'/%3E%3Cpath d='M26 52v16c0 7 10.7 12 24 12s24-5 24-12V52l-14 6.6V66c0 3-4.5 5.5-10 5.5s-10-2.5-10-5.5v-7.4z' fill='%231a1440'/%3E%3Cpath d='M88 42v18' stroke='%231a1440' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

  <div class="bg-blob b1"></div>
  <div class="bg-blob b2"></div>

  <main>
    <div class="auth-card" id="authCard">
      <div class="logo">
        <span class="logo-icon"><i data-icon="cap"></i></span>
        <span class="logo-text">آية <b>باك</b></span>
        <span class="logo-year">2027</span>
      </div>
      <p class="tagline">منصتك للتفوق في شهادة البكالوريا <i data-icon="dz"></i><br>دروس، فيديوهات، ملخصات وتمارين</p>

      <form id="loginForm" novalidate>
        <label class="field">
          <span><i data-icon="key"></i> كلمة السر</span>
          <div class="pw-wrap">
            <input type="password" id="pw" autocomplete="current-password" placeholder="••••••••" required>
            <button type="button" class="pw-toggle" id="togglePw" aria-label="إظهار / إخفاء كلمة السر"><i data-icon="eye"></i></button>
          </div>
        </label>

        <label class="remember">
          <input type="checkbox" id="remember">
          تذكرني على هذا الجهاز
        </label>

        <p class="error-msg" id="err" hidden><i data-icon="x-circle"></i> كلمة السر غير صحيحة، حاول مرة أخرى</p>

        <button class="btn btn-primary btn-block" type="submit" id="loginBtn"><i data-icon="unlock"></i> دخول</button>
      </form>
    </div>
    <p class="auth-foot">© 2027 آية باك — صُنع بحب لطلاب الجزائر <i data-icon="heart"></i></p>
  </main>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script>
    'use strict';
    /* إذا كان مسجلاً الدخول مسبقاً → ننقله مباشرة للصفحة الرئيسية */
    if (isAuthed()) location.replace('home.html');

    var card = $('#authCard');
    hydrateIcons();
    var pwInput = $('#pw');
    var errBox = $('#err');

    /* إظهار / إخفاء كلمة السر */
    $('#togglePw').addEventListener('click', function () {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
      this.innerHTML = pwInput.type === 'password' ? svgIcon('eye') : svgIcon('eye-off');
      pwInput.focus();
    });

    $('#loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      errBox.hidden = true;

      var ok = doLogin(pwInput.value, $('#remember').checked);
      if (ok) {
        var btn = $('#loginBtn');
        var target = afterLoginUrl(); /* العودة للصفحة المقصودة إن وُجدت */
        btn.innerHTML = svgIcon('check') + ' تم الدخول، جارٍ التحويل...';
        btn.disabled = true;
        setTimeout(function () { location.href = target; }, 700);
      } else {
        errBox.hidden = false;
        card.classList.remove('shake');
        void card.offsetWidth; /* إعادة تشغيل الحركة */
        card.classList.add('shake');
        pwInput.value = '';
        pwInput.focus();
      }
    });

    pwInput.focus();
  </script>
</body>
</html>
